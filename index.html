<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แบบประเมินความพึงพอใจ </title>
    <link rel="icon" href="img/logo1.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- 🌈 Variables & Core Styles --- */
        :root {
            --glass-bg: rgba(20, 20, 35, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-inner-bg: rgba(255, 255, 255, 0.03);
            --accent-color: #00f2fe;
            --secondary-color: #ff0080;
            --text-main: #ffffff;
            --body-bg: #0f0c29; 
            --input-bg: rgba(255, 255, 255, 0.06);
            --radio-inner: #151525;
            --opt-bg: #1a1a2e; /* พื้นหลัง Option โหมดมืด */
        }

        body.light-mode {
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.1);
            --card-inner-bg: rgba(0, 0, 0, 0.02);
            --accent-color: #0056b3; 
            --secondary-color: #d81b60;
            --text-main: #222222;
            --body-bg: #e4e9f2;
            --input-bg: rgba(0, 0, 0, 0.05);
            --radio-inner: #ffffff;
            --opt-bg: #ffffff; /* พื้นหลัง Option โหมดสว่าง */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--body-bg); font-family: 'Kanit', sans-serif;
            color: var(--text-main); min-height: 100vh; overflow-x: hidden;
            transition: background 0.5s ease; line-height: 1.6;
        }

        /* --- ✨ Background Effects --- */
        .video-container { position: fixed; inset: 0; z-index: -3; overflow: hidden; background: var(--body-bg); }
        .video-container video { min-width: 100%; min-height: 100%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); object-fit: cover; opacity: 0.2; mix-blend-mode: screen; }
        body.light-mode .video-container video { mix-blend-mode: multiply; opacity: 0.1; }
        .video-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 0%, var(--body-bg) 100%); z-index: -2; }
        .blob { position: fixed; width: 400px; height: 400px; filter: blur(100px); border-radius: 50%; z-index: -1; opacity: 0.2; animation: move 15s infinite alternate ease-in-out; }
        .blob-1 { top: -100px; left: -100px; background: var(--accent-color); }
        .blob-2 { bottom: -100px; right: -100px; background: var(--secondary-color); }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(60px, 60px); } }

        /* --- 🔘 Theme & Admin --- */
        .theme-toggle, .admin-login-btn {
            position: fixed; z-index: 1000; top: 20px; background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); color: var(--text-main); cursor: pointer; transition: 0.3s;
        }
        .theme-toggle { left: 20px; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .admin-login-btn { right: 20px; height: 45px; padding: 0 15px; border-radius: 25px; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 0.9rem; }

        /* --- 📦 Main Container --- */
        .form-wrapper {
            position: relative; z-index: 10; max-width: 900px; margin: 80px auto 40px; padding: 30px 20px;
            background: var(--glass-bg); backdrop-filter: blur(30px); border: 1px solid var(--glass-border);
            border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .header-title { text-align: center; margin-bottom: 30px; }
        .header-title h1 { color: var(--accent-color); font-size: 1.8rem; margin-bottom: 5px; }

        /* --- 🛠 Select Box FIX (สำหรับโหมดมืด) --- */
        select.form-select {
            width: 100%; background: var(--input-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 12px; color: var(--text-main); outline: none; font-family: inherit;
            appearance: none; -webkit-appearance: none; cursor: pointer;
        }
        /* บังคับสีของ Option */
        select.form-select option {
            background-color: var(--opt-bg) !important;
            color: var(--text-main) !important;
        }

        /* --- 🗂️ Card Structure (Grouping Sub-questions) --- */
        .section-header { 
            background: linear-gradient(90deg, var(--accent-color), transparent);
            color: #fff; padding: 12px 20px; margin: 40px 0 15px -20px;
            border-radius: 0 50px 50px 0; font-weight: 600; font-size: 1.1rem;
            display: flex; align-items: center; gap: 10px;
        }
        
        .main-card {
            background: var(--card-inner-bg); border: 1px solid var(--glass-border);
            border-radius: 25px; padding: 10px; margin-bottom: 30px;
        }

        .sub-question-item {
            padding: 20px; border-bottom: 1px solid var(--glass-border);
        }
        .sub-question-item:last-child { border-bottom: none; }

        .q-title { display: flex; gap: 10px; margin-bottom: 15px; }
        .q-num { color: var(--accent-color); font-weight: 800; font-size: 1.1rem; min-width: 35px; }
        .q-text { font-size: 1rem; color: var(--text-main); font-weight: 400; }

        /* Rating Row */
        .rating-row {
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(0, 242, 254, 0.05); border-radius: 15px; 
            padding: 12px 5px; margin-bottom: 15px;
        }
        .rating-item { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
        .rating-label { font-weight: 700; font-size: 0.85rem; opacity: 0.8; }

        /* Neon Radio */
        input[type="radio"] {
            -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%;
            background: var(--input-bg); border: 2px solid var(--glass-border); cursor: pointer; transition: 0.3s;
        }
        input[type="radio"]:checked {
            background: var(--accent-color); border-color: var(--accent-color);
            box-shadow: inset 0 0 0 5px var(--radio-inner), 0 0 15px var(--accent-color);
        }

        /* Inputs */
        .input-style {
            background: var(--input-bg); border: 1px solid var(--glass-border);
            border-radius: 10px; padding: 10px 15px; color: var(--text-main);
            width: 100%; outline: none; transition: 0.3s; font-family: inherit; font-size: 0.9rem;
        }
        .input-style:focus { border-color: var(--accent-color); }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-color), #00a8ff); border: none;
            border-radius: 50px; width: 100%; padding: 18px; color: #fff; font-size: 1.2rem;
            font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 20px;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0, 242, 254, 0.4); }

        /* --- 🌟 Wizard Steps Styles --- */
        .wizard-step { display: none; animation: fadeIn 0.4s ease; }
        .wizard-step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .wizard-nav { display: flex; justify-content: space-between; margin-top: 20px; gap: 15px; }
        .wizard-nav.right { justify-content: flex-end; }
        .btn-nav {
            background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text-main);
            padding: 12px 25px; border-radius: 12px; cursor: pointer; transition: 0.3s; font-size: 1rem;
        }
        .btn-nav:hover { background: rgba(255,255,255,0.1); }
        .btn-nav-primary {
            background: linear-gradient(135deg, var(--accent-color), #00a8ff); color: #fff; border: none; font-weight: 600;
        }
        .btn-nav-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 242, 254, 0.3); }
        .comment-box { display: none; margin-top: 15px; animation: fadeIn 0.3s ease; }
        
        /* Progress Bar */
        .progress-container { width: 100%; height: 6px; background: var(--input-bg); border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--secondary-color), var(--accent-color)); width: 0%; transition: width 0.4s ease; }

        @media (max-width: 600px) {
            .form-wrapper { padding: 25px 15px; }
            .sub-question-item { padding: 15px 10px; }
            .rating-label { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="theme-toggle" id="theme-toggle"><i class="fa-solid fa-moon"></i></div>
    <a href="admin.html" class="admin-login-btn"><i class="fa-solid fa-user-shield"></i> <span>Admin</span></a>

    <div class="video-container">
        <video autoplay muted loop playsinline><source src="vdo/vdobg2.mp4" type="video/mp4"></video>
        <div class="video-overlay"></div>
    </div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="form-wrapper">
        <div class="header-title">
            <img src="logo.png" style="max-width:100px; margin-bottom:10px;" onerror="this.style.display='none'">
            <h1>แบบประเมินความพึงพอใจการจัดการศึกษา</h1>
            <p style="opacity: 0.8;">โรงเรียนโยธินนุกูล สังกัดเทศบาลตำบลหนองไผ่ล้อม</p>
        </div>

        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

        <form id="evaluationForm">
            <!-- ส่วนที่ 1: ข้อมูลทั่วไป -->
            <div class="wizard-step active" id="step-0">
                <div class="section-header" style="background: none; color: var(--accent-color); margin-left: 0; padding-left: 0;">
                    <i class="fa-solid fa-id-card"></i> ส่วนที่ ๑ ข้อมูลทั่วไป
                </div>
                <div class="main-card" style="padding: 20px;">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                        <div class="form-group">
                            <p style="margin-bottom:10px;"><strong>๑. สถานะของผู้ตอบ:</strong></p>
                            <select name="status" class="form-select" required>
                                <option value="" disabled selected>-- เลือกสถานะ --</option>
                                <option value="parent">ผู้ปกครอง</option>
                                <option value="student">นักเรียน</option>
                                <option value="teacher">ครู/บุคลากร</option>
                                <option value="committee">คณะกรรมการสถานศึกษา</option>
                            </select>
                            <div style="margin-top:12px;">
                                <input type="text" name="additional_info" class="input-style" placeholder="ระบุเพิ่มเติม (เช่น ชั้นปี/สถานะอื่นๆ)">
                            </div>
                        </div>
                        <div class="form-group">
                            <p style="margin-bottom:10px;"><strong>๒. เพศ:</strong></p>
                            <select name="gender" class="form-select" required>
                                <option value="" disabled selected>-- เลือกเพศ --</option>
                                <option value="male">ชาย</option>
                                <option value="female">หญิง</option>
                                <option value="not_specified">ไม่ระบุ</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="wizard-nav right">
                    <button type="button" class="btn-nav btn-nav-primary" onclick="nextStep()">เริ่มทำแบบประเมิน <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <div id="survey-content"></div>

            <script>
                const sections = [
                    { t: "1. ด้านการบริหารจัดการสถานศึกษา", icon: "fa-users-gear", q: ["สถานศึกษามีการบริหารงานอย่างเป็นระบบ ชัดเจน และตรวจสอบได้", "สถานศึกษามีการวางแผนและกำหนดเป้าหมายการพัฒนาอย่างเหมาะสม", "สถานศึกษามีการประชาสัมพันธ์ข่าวสาร กิจกรรม และข้อมูลต่าง ๆ อย่างทั่วถึง", "สถานศึกษาเปิดโอกาสให้ผู้ปกครองและชุมชนมีส่วนร่วมในการดำเนินงาน", "สถานศึกษามีการให้บริการผู้มาติดต่อด้วยความสะดวก รวดเร็ว"] },
                    { t: "2. ด้านการจัดการเรียนรู้", icon: "fa-book-open-reader", q: ["สถานศึกษาจัดการเรียนการสอนที่ส่งเสริมให้นักเรียนเกิดการเรียนรู้อย่าง  เต็มศักยภาพ", "สถานศึกษาส่งเสริมให้ครูใช้สื่อ เทคโนโลยี และนวัตกรรมในการจัดการเรียนรู้", "สถานศึกษาจัดกิจกรรมการเรียนรู้ที่เน้นการคิดวิเคราะห์ การแก้ปัญหา และการลงมือปฏิบัติจริง", "สถานศึกษาจัดเนื้อหาและกิจกรรมการเรียนรู้ที่สอดคล้องกับชีวิตประจำวันและการนำไปใช้จริง", "สถานศึกษามีระบบการวัดและประเมินผลการเรียนรู้ที่ยุติธรรม เหมาะสม และโปร่งใส"] },
                    { t: "3. ด้านคุณภาพผู้เรียน", icon: "fa-graduation-cap", q: ["สถานศึกษาส่งเสริมให้นักเรียนมีผลสัมฤทธิ์ทางการเรียนตามมาตรฐานการศึกษา", "สถานศึกษาส่งเสริมให้นักเรียนมีคุณธรรม จริยธรรม และมีระเบียบวินัย", "สถานศึกษาส่งเสริมให้นักเรียนมีความรับผิดชอบต่อตนเองและสังคม", "สถานศึกษาส่งเสริมให้นักเรียนมีทักษะการคิด วิเคราะห์ และการแก้ปัญหาอย่างสร้างสรรค์", "สถานศึกษาส่งเสริมให้นักเรียนสามารถทำงานร่วมกับผู้อื่น และอยู่ร่วมกันในสังคมได้อย่างเหมาะสม"] },
                    { t: "4. ด้านอาคารสถานที่และสิ่งแวดล้อม", icon: "fa-school", q: ["สถานศึกษามีอาคารเรียน ห้องเรียน และบริเวณโดยรอบที่สะอาด เป็นระเบียบ และปลอดภัย", "สถานศึกษาจัดสภาพแวดล้อมและบรรยากาศที่เอื้อต่อการเรียนรู้ของนักเรียน", "สถานศึกษามีวัสดุ อุปกรณ์ สื่อ และแหล่งเรียนรู้ที่เพียงพอต่อการจัดการศึกษา", "สถานศึกษามีการดูแลรักษาสภาพแวดล้อมให้ร่มรื่น สวยงาม และน่าอยู่", "สถานศึกษามีระบบสาธารณูปโภค เช่น น้ำ ไฟฟ้า อินเทอร์เน็ต และห้องน้ำ   ที่พร้อมใช้งาน"] },
                    { t: "5. ด้านระบบดูแลช่วยเหลือนักเรียน", icon: "fa-handshake-angle", q: ["สถานศึกษามีมาตรการดูแลความปลอดภัยของนักเรียนอย่างเหมาะสม", "สถานศึกษามีระบบการให้คำปรึกษาและช่วยเหลือนักเรียนอย่างทั่วถึง", "สถานศึกษาจัดกิจกรรมส่งเสริมสุขภาพ คุณธรรม จริยธรรม และพฤติกรรมที่เหมาะสม", "สถานศึกษารับฟังความคิดเห็น ปัญหา และความต้องการของนักเรียนอย่างเหมาะสม", "สถานศึกษามีการติดตาม ดูแล และช่วยเหลือนักเรียนเป็นรายบุคคลเมื่อเกิดปัญหา"] },
                    { t: "6. ด้านความสัมพันธ์กับชุมชน", icon: "fa-people-roof", q: ["สถานศึกษามีการสื่อสารและประสานงานกับผู้ปกครองอย่างสม่ำเสมอ", "สถานศึกษาเปิดโอกาสให้ผู้ปกครองและชุมชนเข้ามามีส่วนร่วมในกิจกรรมต่าง ๆ", "สถานศึกษาสร้างความสัมพันธ์อันดีระหว่างโรงเรียน ผู้ปกครอง และชุมชน", "สถานศึกษามีการให้บริการหรือจัดกิจกรรมที่เป็นประโยชน์ต่อชุมชน", "สถานศึกษารับฟังข้อคิดเห็นและข้อเสนอแนะจากผู้ปกครองและชุมชน     เพื่อนำไปพัฒนา"] }
                ];

                let container = document.getElementById('survey-content');
                let stepIndex = 1;
                
                sections.forEach((s, si) => {
                    s.q.forEach((v, qi) => {
                        let mainNum = si + 1;
                        let subNum = qi + 1;
                        let id = `${mainNum}_${subNum}`;
                        
                        let stepHtml = `
                        <div class="wizard-step" id="step-${stepIndex}">
                            <div class="section-header" style="background: none; color: var(--accent-color); margin-left: 0; padding-left: 0;">
                                <i class="fa-solid ${s.icon}"></i> ${s.t}
                            </div>
                            <div class="main-card" style="padding: 20px;">
                                <div class="q-title" style="margin-bottom: 20px;">
                                    <span class="q-num" style="font-size: 1.3rem;">${mainNum}.${subNum}</span>
                                    <span class="q-text" style="font-size: 1.1rem; font-weight: 500;">${v}</span>
                                </div>
                                <div class="rating-row" style="padding: 20px 10px;">
                                    <div class="rating-item"><span class="rating-label">5</span><input type="radio" name="q${id}" value="5" onchange="handleRadio(this, ${stepIndex})"></div>
                                    <div class="rating-item"><span class="rating-label">4</span><input type="radio" name="q${id}" value="4" onchange="handleRadio(this, ${stepIndex})"></div>
                                    <div class="rating-item"><span class="rating-label">3</span><input type="radio" name="q${id}" value="3" onchange="handleRadio(this, ${stepIndex})"></div>
                                    <div class="rating-item"><span class="rating-label">2</span><input type="radio" name="q${id}" value="2" onchange="handleRadio(this, ${stepIndex})"></div>
                                    <div class="rating-item"><span class="rating-label">1</span><input type="radio" name="q${id}" value="1" onchange="handleRadio(this, ${stepIndex})"></div>
                                </div>
                                <div class="comment-box" id="comment-box-${stepIndex}">
                                    <p style="color: var(--secondary-color); font-size: 0.9rem; margin-bottom: 8px;"><i class="fa-solid fa-circle-info"></i> กรุณาระบุเหตุผลหรือข้อเสนอแนะสำหรับคะแนนนี้</p>
                                    <input type="text" name="c${id}" class="input-style sub-comment" placeholder="เหตุผล/ข้อเสนอแนะสำหรับข้อนี้...">
                                </div>
                            </div>
                            <div class="wizard-nav">
                                <button type="button" class="btn-nav" onclick="prevStep()"><i class="fa-solid fa-arrow-left"></i> ย้อนกลับ</button>
                                <button type="button" class="btn-nav btn-nav-primary" id="btn-next-${stepIndex}" onclick="nextStep()" style="display:none;">ถัดไป <i class="fa-solid fa-arrow-right"></i></button>
                            </div>
                        </div>`;
                        container.innerHTML += stepHtml;
                        stepIndex++;
                    });
                });

                const MAX_STEP = stepIndex; // ข้อเสนอแนะรวมจะเป็น step สุดท้าย
                let currentStep = 0;

                function updateProgress() {
                    const progress = (currentStep / MAX_STEP) * 100;
                    document.getElementById('progressBar').style.width = progress + '%';
                }

                function showStep(n) {
                    document.querySelectorAll('.wizard-step').forEach(el => el.classList.remove('active'));
                    const stepEl = document.getElementById(n === MAX_STEP ? 'step-last' : `step-${n}`);
                    if(stepEl) stepEl.classList.add('active');
                    updateProgress();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }

                function validateStep(n) {
                    const stepEl = document.getElementById(n === MAX_STEP ? 'step-last' : `step-${n}`);
                    if (!stepEl) return true;

                    if (n === 0) {
                        const status = stepEl.querySelector('select[name="status"]');
                        const gender = stepEl.querySelector('select[name="gender"]');
                        if (!status.value || !gender.value) { alert("กรุณาเลือกสถานะและเพศให้ครบถ้วน"); return false; }
                    } else if (n > 0 && n < MAX_STEP) {
                        const radio = stepEl.querySelector('input[type="radio"]:checked');
                        if (!radio) { alert("กรุณาเลือกคะแนนประเมินครับ"); return false; }
                        if (radio.value === '1' || radio.value === '2') {
                            const comment = stepEl.querySelector('.sub-comment');
                            if (!comment.value.trim()) {
                                alert("กรุณาระบุเหตุผลในข้อที่ท่านประเมิน 'น้อย' หรือ 'น้อยที่สุด' ครับ");
                                comment.style.borderColor = "var(--secondary-color)";
                                comment.focus();
                                return false;
                            } else {
                                comment.style.borderColor = "var(--glass-border)";
                            }
                        }
                    }
                    return true;
                }

                function nextStep() {
                    if (!validateStep(currentStep)) return;
                    if (currentStep < MAX_STEP) {
                        currentStep++;
                        showStep(currentStep);
                    }
                }

                function prevStep() {
                    if (currentStep > 0) {
                        currentStep--;
                        showStep(currentStep);
                    }
                }

                function handleRadio(radio, stepIdx) {
                    const val = radio.value;
                    const commentBox = document.getElementById(`comment-box-${stepIdx}`);
                    const btnNext = document.getElementById(`btn-next-${stepIdx}`);
                    const commentInput = commentBox.querySelector('input');

                    btnNext.style.display = 'block';

                    if (val === '1' || val === '2') {
                        commentBox.style.display = 'block';
                        commentInput.focus();
                    } else {
                        commentBox.style.display = 'none';
                        commentInput.value = '';
                        setTimeout(() => { nextStep(); }, 350);
                    }
                }
            </script>

            <!-- ส่วนที่ 3: ข้อเสนอแนะ -->
            <div class="wizard-step" id="step-last">
                <div class="section-header" style="background: none; color: var(--accent-color); margin-left: 0; padding-left: 0;">
                    <i class="fa-solid fa-comments"></i> ส่วนที่ ๓ ข้อเสนอแนะในภาพรวม
                </div>
                <div class="main-card" style="padding: 15px;">
                    <textarea name="suggestions" rows="4" class="input-style" placeholder="ระบุข้อเสนอแนะเพิ่มเติมในภาพรวมที่นี่..."></textarea>
                </div>
                <div class="wizard-nav">
                    <button type="button" class="btn-nav" onclick="prevStep()"><i class="fa-solid fa-arrow-left"></i> ย้อนกลับ</button>
                    <button type="submit" class="btn-submit" style="margin-top: 0; width: auto; padding: 12px 25px; border-radius: 12px; font-size: 1rem;"><i class="fa-solid fa-paper-plane"></i> ส่งแบบประเมิน</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        // --- 🌓 Theme Logic ---
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeBtn.innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });
        if(localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>'; }

        // --- 🚀 Validation & Submit ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyi68ymvz6_3TDgRJ1enuwT0daM1YdbK2lDw0oGo1xE7TWYxq_ZLAcV0YO53YCzPix0/exec';
        const form = document.getElementById('evaluationForm');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            const btn = document.querySelector('.btn-submit');
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังส่งข้อมูล...';

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(res => {
                    alert('บันทึกเรียบร้อย ขอบคุณครับ!');
                    form.reset(); location.reload();
                })
                .catch(err => {
                    alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
                    btn.disabled = false; btn.innerHTML = 'ส่งแบบประเมิน';
                });
        });
    </script>
</body>
</html>
